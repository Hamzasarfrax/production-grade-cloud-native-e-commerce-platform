  <rect x="0" y="0" width="1660" height="930" fill="#f8fafc"/>
  <text x="40" y="42" font-size="24" font-weight="bold" fill="#0f172a">Mxmobilz — Cloud-Native Architecture &amp; Delivery (actual repo state, 2026-09-02)</text>
  <text x="40" y="64" font-size="13" fill="#475569">Every status dot below is provable from this repo or its linked logs — mirrors the README reality-check table and docs/STATUS.md.</text>

