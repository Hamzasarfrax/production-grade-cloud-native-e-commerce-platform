# ==============================================================================
# Nginx stub_status — Required for nginx-prometheus-exporter
# ==============================================================================
# This config is auto-included in the backend nginx.
# Enables /stub_status endpoint for Prometheus metrics.
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    # --- Nginx stub_status (Prometheus scraping) ---
    location /stub_status {
        stub_status;
        allow 172.16.0.0/12;   # Docker network range
        allow 10.0.0.0/8;      # Kubernetes pod network
        deny all;
    }

    # --- Laravel application ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass backend-app:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.ht {
        deny all;
    }
}
