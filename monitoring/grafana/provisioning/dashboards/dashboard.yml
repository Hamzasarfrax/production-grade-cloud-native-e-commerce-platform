# ==============================================================================
# Grafana Dashboard Provisioning — Auto-load dashboards from /var/lib/grafana/dashboards
# ==============================================================================

apiVersion: 1

providers:
  - name: 'Mxmobilz'
    orgId: 1
    folder: 'Mxmobilz'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
