; ==============================================================================
; PHP-FPM Status Configuration — Required for php-fpm-exporter
; ==============================================================================
; Add this to your php-fpm pool config (www.conf or docker php-fpm config)
; Enables /fpm-status endpoint for Prometheus scraping.
; ==============================================================================

[www]
; Status page for metrics
pm.status_path = /fpm-status

; Ping page for health checks
ping.path = /fpm-ping

; Security: restrict status page access
; Only allow from Docker/K8s networks
