apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-network-policy
  namespace: cloud-native-ecomerce-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mysql

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 3306

  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53