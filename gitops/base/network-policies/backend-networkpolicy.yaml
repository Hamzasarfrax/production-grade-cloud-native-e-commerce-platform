apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
  namespace: cloud-native-ecomerce-dev
spec:
  podSelector:
    matchLabels:
      app: backend

  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Frontend + Ingress-NGINX → Backend
    - from:
        - podSelector:
            matchLabels:
              app: frontend

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx

      ports:
        - protocol: TCP
          port: 8000

    # Backend → PHP-FPM sidecar/container
    - from:
        - podSelector:
            matchLabels:
              app: backend

      ports:
        - protocol: TCP
          port: 9000

  egress:
    # Backend → MySQL
    - to:
        - podSelector:
            matchLabels:
             app.kubernetes.io/name: mysql
      ports:
        - protocol: TCP
          port: 3306

    # DNS
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53