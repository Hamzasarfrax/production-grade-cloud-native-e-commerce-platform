apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: mxmobilz-staging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: mxmobilz
spec:
  applicationRefs:
    - namePattern: mxmobilz-staging
      images:
        - alias: backend
          imageName: hamzasarfraz862/backend-app:1.0.0
          manifestTargets:
            kustomize:
              name: hamzasarfraz862/backend-app
        - alias: frontend
          imageName: hamzasarfraz862/front-end-app:1.0.0
          manifestTargets:
            kustomize:
              name: hamzasarfraz862/front-end-app
  commonUpdateSettings:
    updateStrategy: semver
    allowTags: "regexp:^[0-9]+\\.[0-9]+\\.[0-9]+$"
    ignoreTags:
      - latest
    forceUpdate: false
  writeBackConfig:
    method: git:secret:ssh-git-creds
    gitConfig:
      repository: git@github.com:Hamzasarfraz/production-grade-cloud-native-e-commerce-platform.git
      branch: main
      writeBackTarget: kustomization:/gitops/overlays/staging
