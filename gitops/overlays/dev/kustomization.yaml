apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: cloud-native-ecomerce-dev

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: backend-backend-helm
    spec:
      replicas: 1
  target:
    kind: Deployment
    labelSelector: app.kubernetes.io/name=backend
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: frontend-deployment
    spec:
      replicas: 1
  target:
    kind: Deployment
    labelSelector: app=frontend-app
- patch: |-
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: mysql
    spec:
      replicas: 1
  target:
    kind: StatefulSet
    labelSelector: app=mysql

configMapGenerator:
- name: env-config
  behavior: merge
  literals:
  - ENVIRONMENT=development
  - LOG_LEVEL=debug

commonLabels:
  environment: dev