apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: cloud-native-ecomerce-dev

images:
- name: hamzasarfraz862/backend-app
  newTag: 1.0.0

- name: hamzasarfraz862/front-end-app
  newTag: 1.0.0

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: backend
    spec:
      replicas: 1
  target:
    kind: Deployment
    labelSelector: app=backend
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: frontend
    spec:
      template:
        spec:
          containers:
          - name: frontend
            env:
            - name: BACKEND_URL
              value: "http://172.18.0.7:8000"
  target:
    kind: Deployment
    labelSelector: app=frontend
- patch: |-
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: mysql
    spec:
      replicas: 1
  target:
    kind: StatefulSet
    labelSelector: app=mysql

configMapGenerator:
- name: env-config
  behavior: create
  literals:
  - ENVIRONMENT=development
  - LOG_LEVEL=debug

labels:
  - pairs:
      environment: dev