architecture: standalone

image:
  registry: docker.io
  repository: bitnami/mysql
  tag: 8.4.5-debian-12-r0
  pullPolicy: IfNotPresent

auth:
  database: ecommerce
  username: ecommerce

  existingSecret: mysql-app-secret

  secretKeys:
    rootPasswordKey: mysql-root-password
    userPasswordKey: mysql-password

primary:
  persistence:
    enabled: true
    size: 10Gi

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

service:
  type: ClusterIP
  ports:
    mysql: 3306