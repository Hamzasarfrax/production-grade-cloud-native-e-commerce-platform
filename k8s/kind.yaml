kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mxmobilz-prod
# Production-style multi-node cluster topology: control-plane + 2 workers.
# "production feel" demo ke liye — HA-like topology (multiple nodes).
nodes:
  - role: control-plane
    # ingress-ready=true label nginx-ingress-controller (kind manifest) ko
    # control-plane pe schedule hone deta hai. Ye kind ka standard hai.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Host <-> cluster port mapping: localhost:80 -> controller:80, 443 -> 443.
    # Isse ingress ko binah kubectl port-forward ke, seedha browser/curl se
    # http://localhost pe access kar sakte hain (production-like external access).
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
