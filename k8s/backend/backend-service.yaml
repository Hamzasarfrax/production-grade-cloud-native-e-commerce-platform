apiVersion: v1
kind: Service
metadata:
  name: backend-helm
  namespace: cloud-native-ecomerce-app
  labels:
    app: backend-app
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: backend-helm
    app.kubernetes.io/instance: backend
