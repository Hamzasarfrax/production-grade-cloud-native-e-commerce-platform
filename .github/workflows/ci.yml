name: CI/CD Pipeline

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_APP: backend-app
  FRONTEND_APP: front-end-app
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # =========================================================================
  # Job 1: Backend CI — lint, static analysis, tests
  # =========================================================================
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, zip, gd
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP Syntax Check
        run: find app routes database -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: PHPStan Static Analysis
        run: vendor/bin/phpstan analyse --no-progress || true

      - name: PHPUnit Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          vendor/bin/phpunit --testsuite=Unit || true

  # =========================================================================
  # Job 2: Frontend CI — install, lint, typecheck, build
  # =========================================================================
  frontend-test:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # =========================================================================
  # Job 3: Terraform validation
  # =========================================================================
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Init (no remote backend)
        run: cd infra/env/dev && terraform init -backend=false

      - name: Validate
        run: cd infra/env/dev && terraform validate

      - name: Format check
        run: terraform fmt -check -recursive infra/ || true

  # =========================================================================
  # Job 4: Build & Push Docker Images (with Trivy security scan)
  # =========================================================================
  build-images:
    name: Build & Push Images (Backend + Frontend)
    needs: [backend-test, frontend-test, terraform-validate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: backend-app
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: front-end-app
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@0.19.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          output: trivy-report.txt

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-report.txt

  # =========================================================================
  # Job 5: Update GitOps (image tags in kustomization)
  # =========================================================================
  update-gitops:
    name: Update GitOps (Dev)
    needs: build-images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Kustomize
        run: |
          curl -sL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Update backend image tag (gitops/dev)
        run: |
          sed -i \
            "s|image: .*/backend-app:.*|image: ghcr.io/${{ github.repository_owner }}/backend-app:${{ env.IMAGE_TAG }}|g" \
            gitops/overlays/dev/kustomization.yaml

      - name: Update frontend image tag (gitops/dev)
        run: |
          sed -i \
            "s|image: .*/front-end-app:.*|image: ghcr.io/${{ github.repository_owner }}/front-end-app:${{ env.IMAGE_TAG }}|g" \
            gitops/overlays/dev/kustomization.yaml

      - name: Validate kustomize build
        run: |
          kustomize build gitops/overlays/dev > /tmp/render-dev.yaml
          echo "Kustomize build successful."

      - name: Commit GitOps changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/overlays/dev/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No GitOps changes detected."
            exit 0
          fi
          git commit -m "chore(gitops): deploy ${{ env.IMAGE_TAG }} to dev"
          git push

      - name: Deployment summary
        run: |
          echo "======================================"
          echo "  DEPLOYED IMAGES"
          echo "======================================"
          echo "Backend:  ghcr.io/${{ github.repository_owner }}/backend-app:${{ env.IMAGE_TAG }}"
          echo "Frontend: ghcr.io/${{ github.repository_owner }}/front-end-app:${{ env.IMAGE_TAG }}"
          echo ""
          echo "ArgoCD will detect the Git change and auto-sync."
