name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: mxmobilz-prod
  NAMESPACE: cloud-native-ecomerce-prod
  GHCR: ghcr.io

jobs:
  # =========================================================================
  # Deployment Gate: Manual review before touching prod
  # =========================================================================
  pre-deploy:
    name: Pre-deploy Review ${GITHUB_REF_NAME}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm production deploy
        run: |
          echo "⚠️  PRODUCTION DEPLOYMENT APPROVED"
          echo "Environment: prod"
          echo "Triggered by: ${{ github.actor }}"
          echo "Proceeding..."

  # =========================================================================
  # Deploy: Apply GitOps prod overlay to EKS
  # =========================================================================
  deploy-prod:
    name: Deploy to EKS Production
    needs: pre-deploy
    runs-on: ubuntu-latest
    environment: prod           # <-- Manual approval gate in GitHub UI
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/gh-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kustomize
        run: |
          curl -sL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}
          kubectl version --client

      - name: Apply prod overlays
        run: |
          kustomize build gitops/overlays/prod | tee /tmp/prod-render.yaml
          kubectl apply -f /tmp/prod-render.yaml

      - name: Wait for rollout (backend)
        run: |
          kubectl rollout status deployment/backend -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Wait for rollout (frontend)
        run: |
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Verify pods
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get deployment -n ${{ env.NAMESPACE }}

  # =========================================================================
  # Verify: Smoke test after deployment
  # =========================================================================
  verify-prod:
    name: Production Smoke Test
    needs: deploy-prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/gh-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ingress host
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}
          LB_HOST=$(kubectl get svc -n ingress-nginx ingress-nginx-controller \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "LB_HOST=$LB_HOST" >> $GITHUB_ENV

      - name: Test frontend
        run: |
          echo "Testing frontend..."
          curl -s -o /dev/null -w "%{http_code}" "http://${{ env.LB_HOST }}/"
          echo " - frontend reachable"

      - name: Test API health
        run: |
          echo "Testing API health..."
          curl -s "http://${{ env.LB_HOST }}/api/health"
          echo ""

      - name: Test API products
        run: |
          echo "Testing products API..."
          curl -s "http://${{ env.LB_HOST }}/api/products" | head -c 200
          echo ""
