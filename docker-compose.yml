services:

  front-end-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce-front-end-app
    image: front-end-app:1.0.0
    ports:
      - "3000:80"
    environment:
      # frontend nginx ka /api reverse-proxy is service ko hit karega
      BACKEND_URL: http://backend-nginx:80
    depends_on:
      - backend-nginx
    networks:
      - app_newtwork

  backend-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-backend-app
    image: backend-app:1.0.2
    expose:
      - "9000"
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_newtwork

  backend-nginx:
    image: nginx:alpine
    container_name: ecommerce-backend-nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-app
    networks:
      - app_newtwork

  mysql:
    image: mysql:8.4
    container_name: ecommerce-mysql
    environment:
      # names backend/.env (Laravel) se match hone chahiye
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # $$ = compose interpolation se escape (variable container ke andar evaluate ho)
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - app_newtwork

networks:
  app_newtwork:

volumes:
  mysql_data: