# Mxmobilz — Microservices (MySQL + Laravel API + React Web)
# Local dev: docker compose up --build
#   web    -> http://localhost:3000
#   api    -> http://localhost:8000/api
#   db     -> localhost:3306 (mxmobilz / mxmobilzsecret)

services:
  db:
    image: mysql:8.4
    container_name: mxmobilz-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mxmobilz_db
      MYSQL_USER: mxmobilz
      MYSQL_PASSWORD: mxmobilzsecret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ./backend
    container_name: mxmobilz-api
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: mxmobilz_db
      DB_USERNAME: mxmobilz
      DB_PASSWORD: mxmobilzsecret
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "php artisan migrate --seed --force && php artisan serve --host=0.0.0.0 --port=8000"

  web:
    build:
      context: ./frontend
    container_name: mxmobilz-web
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0

volumes:
  mysql-data: