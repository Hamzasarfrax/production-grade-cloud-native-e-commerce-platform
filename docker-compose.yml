services:

  front-end-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce-front-end-app
    image: front-end-app:1.0.0
    ports:
      - "3000:80"
    depends_on:
      - backend-nginx
    networks:
      - app_newtwork

  backend-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-backend-app
    image: backend-app:1.0.0
    expose:
      - "9000"
    env_file:
      - ./backend/.env
    networks:
      - app_newtwork

  backend-nginx:
    image: nginx:alpine
    container_name: ecommerce-backend-nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-app
    networks:
      - app_newtwork

  mysql:
    image: mysql:8.4
    container_name: ecommerce-mysql
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_newtwork

networks:
  app_newtwork:

volumes:
  mysql_data: